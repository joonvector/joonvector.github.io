<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoonVector [한준] | Security Architect & Principal Consultant</title>
  <meta name="description" content="사이버·물리융합보안 전문가 및 IT 프로젝트 매니저, 삼성SDS Principal Consultant JoonVector [한준]">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.25rem;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.06) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    /* Brand Tag */
    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .brand-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--accent);
    }

    /* Name & Korean Name */
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .ko-name {
      font-size: 1.25rem;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0;
    }

    .role-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }
    .role-title span {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Bio Statement (Non-sentence Style) */
    .intro {
      font-size: 0.95rem;
      line-height: 1.75;
      color: #cbd5e1;
      margin-bottom: 2rem;
      word-break: keep-all;
    }

    /* Social & Contact */
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .link-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 1.85rem;
      }
      .ko-name {
        font-size: 1.1rem;
      }
      .links-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Brand Tag -->
    <div class="brand-tag">Direction & Architecture</div>
    
    <!-- Title: Name + Korean Name -->
    <h1>JoonVector <span class="ko-name">[HanJoon]</span></h1>
    <div class="role-title">
      <span>Samsung SDS</span> · Principal Consultant
    </div>

    <!-- Intro Statement (Non-sentence) -->
    <p class="intro">
      사이버보안 및 물리 융합보안 전문가로 IT 프로젝트 매니저(PM) 수행. AX/RX 관련 인공지능 및 로봇공학과 H/W에 관심이 많은 이. <br><br>
      JoonVector: 방향과 힘을 규정하는 벡터(Vector)를 기반으로 명확한 목적과 기준을 따르는 자 라는 의미 
    </p>

    <!-- Connect -->
    <div class="section-label">Connect</div>
    <div class="links-grid">
      <a href="mailto:nawnsl@google.com" class="link-item">
        ✉️ Email
      </a>
      <a href="https://blog.naver.com/joonyel96" target="_blank" rel="noopener noreferrer" class="link-item">
        📝 Blog
      </a>
      <a href="https://github.com/joonvector" target="_blank" rel="noopener noreferrer" class="link-item">
        🐙 GitHub
      </a>
    </div>
  </main>

</body>
</html>
